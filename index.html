<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THREADLENS — 스레드 트래픽의 본질</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* surfaces & ink */
  --page:#0a0c11;
  --surface:#12151c;
  --surface-2:#171b24;
  --surface-3:#1d222d;
  --ink:#f2f0eb;
  --ink-2:#a9a7a1;
  --ink-3:#6f6e6a;
  --hairline:rgba(255,255,255,.07);
  --hairline-2:rgba(255,255,255,.12);
  --grid:#232833;
  /* brand */
  --gold:#d9b878;
  --gold-2:#e8d3a3;
  --gold-dim:rgba(217,184,120,.14);
  --gold-grad:linear-gradient(135deg,#eed9a8 0%,#d9b878 45%,#b8934e 100%);
  /* validated chart series (dark) */
  --s-blue:#3987e5;
  --s-aqua:#199e70;
  --s-yellow:#c98500;
  --s-violet:#9085e9;
  --s-red:#e66767;
  --good:#0ca30c;
  --sans:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Noto Serif KR",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);
  background:var(--page);
  background-image:
    radial-gradient(1100px 550px at 85% -10%, rgba(217,184,120,.07), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(57,135,229,.06), transparent 60%);
  background-attachment:fixed;
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(217,184,120,.3)}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:248px;flex-shrink:0;position:sticky;top:0;height:100vh;
  border-right:1px solid var(--hairline);
  background:rgba(10,12,17,.6);backdrop-filter:blur(14px);
  display:flex;flex-direction:column;padding:28px 16px 20px;
}
.brand{padding:0 12px 24px;border-bottom:1px solid var(--hairline);margin-bottom:18px}
.brand h1{
  font-family:var(--serif);font-weight:900;font-size:21px;letter-spacing:.06em;
  background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand p{font-size:11px;color:var(--ink-3);letter-spacing:.28em;margin-top:5px;text-transform:uppercase}
.nav{flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav a{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
  color:var(--ink-2);text-decoration:none;font-size:13.5px;font-weight:500;
  border-left:2px solid transparent;transition:all .18s ease;
}
.nav a .ico{width:17px;text-align:center;font-size:14px;opacity:.85}
.nav a:hover{color:var(--ink);background:rgba(255,255,255,.03)}
.nav a.active{
  color:var(--gold-2);background:var(--gold-dim);
  border-left-color:var(--gold);font-weight:600;
}
.nav .sep{margin:14px 12px 8px;font-size:10px;letter-spacing:.24em;color:var(--ink-3);text-transform:uppercase}
.side-foot{padding:14px 12px 0;border-top:1px solid var(--hairline);font-size:11px;color:var(--ink-3);line-height:1.7}

.main{flex:1;min-width:0;padding:30px 38px 80px;max-width:1180px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px;gap:16px;flex-wrap:wrap}
.acct{display:flex;align-items:center;gap:13px}
.acct .avatar{
  width:44px;height:44px;border-radius:50%;background:var(--gold-grad);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:900;font-size:18px;color:#1a1408;
  box-shadow:0 0 0 1px rgba(217,184,120,.4),0 0 24px rgba(217,184,120,.15);
}
.acct .who .name{font-weight:700;font-size:15px}
.acct .who .meta{font-size:12px;color:var(--ink-2);margin-top:2px}
.acct .who .meta b{color:var(--gold-2);font-weight:600}
.top-actions{display:flex;gap:8px;align-items:center}
select.profile-sel{
  background:var(--surface-2);color:var(--ink);border:1px solid var(--hairline-2);
  border-radius:10px;padding:8px 12px;font-family:var(--sans);font-size:13px;outline:none;cursor:pointer;
}
.badge-demo{
  font-size:11px;letter-spacing:.08em;color:var(--gold-2);background:var(--gold-dim);
  border:1px solid rgba(217,184,120,.3);padding:4px 10px;border-radius:99px;
}

/* ---------- common blocks ---------- */
.view{display:none;animation:rise .35s ease}
.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
h2.vtitle{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:-.01em}
.vsub{color:var(--ink-2);font-size:13.5px;margin-top:7px;line-height:1.6}
.vhead{margin-bottom:26px}

.card{
  background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0) 55%),var(--surface);
  border:1px solid var(--hairline);border-radius:16px;padding:22px 24px;
}
.card+.card{margin-top:16px}
.card h3{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .sub{font-weight:400;font-size:12px;color:var(--ink-3);margin-left:2px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}

/* stat tiles */
.tile .label{font-size:12px;color:var(--ink-2)}
.tile .value{font-size:29px;font-weight:700;margin-top:8px;letter-spacing:-.01em}
.tile .delta{font-size:12px;margin-top:7px;color:var(--ink-3)}
.tile .delta.up{color:var(--good)}
.tile .delta.down{color:var(--s-red)}
.hero-num{font-size:52px;font-weight:800;letter-spacing:-.02em;line-height:1}
.hero-cap{font-size:12.5px;color:var(--ink-2);margin-top:10px}

/* charts */
.chart-wrap{position:relative;margin-top:16px}
svg{display:block;overflow:visible}
.tooltip{
  position:fixed;z-index:50;pointer-events:none;opacity:0;transition:opacity .12s;
  background:#20242e;border:1px solid var(--hairline-2);border-radius:10px;
  padding:9px 12px;font-size:12px;line-height:1.6;color:var(--ink);
  box-shadow:0 8px 28px rgba(0,0,0,.5);max-width:280px;
}
.tooltip b{color:var(--gold-2)}

/* tier badges */
.tier{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.tier.t4{background:var(--gold-dim);color:var(--gold-2);border:1px solid rgba(217,184,120,.35)}
.tier.t3{background:rgba(25,158,112,.13);color:#3fc496;border:1px solid rgba(25,158,112,.3)}
.tier.t2{background:rgba(255,255,255,.05);color:var(--ink-2);border:1px solid var(--hairline-2)}
.tier.t1{background:rgba(230,103,103,.1);color:var(--s-red);border:1px solid rgba(230,103,103,.25)}

/* post rows */
.post-row{
  display:flex;gap:16px;align-items:flex-start;padding:16px 4px;
  border-bottom:1px solid var(--hairline);
}
.post-row:last-child{border-bottom:none}
.post-row .txt{flex:1;min-width:0}
.post-row .txt .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.post-row .txt .body{font-size:13.5px;color:var(--ink-2);margin-top:7px;line-height:1.65;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post-row .nums{flex-shrink:0;text-align:right;font-size:12px;color:var(--ink-3);line-height:1.8}
.post-row .nums b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.mult{font-weight:800;font-size:16px}
.proj{display:flex;gap:22px;margin-top:10px;font-size:12px;color:var(--ink-3)}
.proj b{color:var(--ink);font-weight:600}

/* meters */
.meter-row{display:flex;align-items:center;gap:14px;margin-top:13px}
.meter-row .m-label{width:76px;font-size:12.5px;color:var(--ink-2);flex-shrink:0}
.meter-row .m-track{flex:1;height:7px;border-radius:99px;background:rgba(57,135,229,.14);overflow:hidden}
.meter-row .m-fill{height:100%;border-radius:99px;background:var(--s-blue);transition:width .5s cubic-bezier(.22,1,.36,1)}
.meter-row .m-val{width:36px;text-align:right;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}

/* forms */
textarea,input[type=text],input[type=number],input[type=datetime-local]{
  width:100%;background:var(--surface-2);border:1px solid var(--hairline-2);border-radius:12px;
  color:var(--ink);font-family:var(--sans);font-size:13.5px;padding:12px 14px;outline:none;
  transition:border-color .15s;
}
textarea:focus,input:focus{border-color:rgba(217,184,120,.45)}
textarea{resize:vertical;min-height:150px;line-height:1.7}
label.f-label{display:block;font-size:12px;color:var(--ink-2);margin:14px 0 6px}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:none;cursor:pointer;
  font-family:var(--sans);font-size:13px;font-weight:700;border-radius:11px;
  padding:11px 20px;transition:all .18s;
}
.btn.gold{background:var(--gold-grad);color:#1a1408;box-shadow:0 4px 18px rgba(217,184,120,.22)}
.btn.gold:hover{transform:translateY(-1px);box-shadow:0 7px 24px rgba(217,184,120,.32)}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--hairline-2)}
.btn.ghost:hover{color:var(--ink);border-color:rgba(255,255,255,.25)}
.btn.danger{background:transparent;color:var(--s-red);border:1px solid rgba(230,103,103,.3)}
.btn.sm{padding:7px 13px;font-size:12px;border-radius:9px}

/* score ring */
.ring-wrap{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.ring{position:relative;width:150px;height:150px;flex-shrink:0}
.ring .ring-num{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.ring .ring-num .n{font-size:37px;font-weight:800}
.ring .ring-num .c{font-size:11px;color:var(--ink-3);margin-top:2px}

/* podium */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.podium .p-card{border-radius:14px;padding:18px;text-align:center;border:1px solid var(--hairline)}
.podium .p-card.first{background:linear-gradient(180deg,rgba(217,184,120,.13),rgba(217,184,120,.03));border-color:rgba(217,184,120,.35)}
.podium .p-card .medal{font-size:20px}
.podium .p-card .when{font-family:var(--serif);font-size:21px;font-weight:700;margin-top:8px}
.podium .p-card.first .when{color:var(--gold-2)}
.podium .p-card .stat{font-size:12px;color:var(--ink-2);margin-top:6px}

/* heatmap */
.hm{display:grid;grid-template-columns:34px repeat(24,1fr);gap:3px;margin-top:18px}
.hm .hm-lab{font-size:10.5px;color:var(--ink-3);display:flex;align-items:center}
.hm .hm-cell{aspect-ratio:1/1;border-radius:4px;cursor:default;transition:transform .1s}
.hm .hm-cell:hover{transform:scale(1.25);outline:1px solid rgba(255,255,255,.35)}
.hm-x{display:grid;grid-template-columns:34px repeat(24,1fr);gap:3px;margin-top:6px}
.hm-x span{font-size:9.5px;color:var(--ink-3);text-align:center}

/* persona */
.persona-card{border-radius:14px;padding:20px;border:1px solid var(--hairline);background:var(--surface-2)}
.persona-card .p-head{display:flex;justify-content:space-between;align-items:baseline}
.persona-card .p-name{font-weight:700;font-size:15px}
.persona-card .p-pct{font-size:22px;font-weight:800;color:var(--gold-2)}
.persona-card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.persona-card .tags span{font-size:11px;color:var(--ink-2);border:1px solid var(--hairline-2);border-radius:99px;padding:3px 9px}
.persona-card .quote{font-size:12.5px;color:var(--ink-2);margin-top:14px;line-height:1.7;font-style:italic;
  border-left:2px solid var(--gold);padding-left:12px}
.p-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.06);margin-top:14px;overflow:hidden}
.p-bar i{display:block;height:100%;border-radius:99px}

/* tips */
.tip-list{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.tip{display:flex;gap:10px;font-size:13px;line-height:1.6;color:var(--ink-2);
  background:var(--surface-2);border:1px solid var(--hairline);border-radius:11px;padding:11px 14px}
.tip .t-ico{flex-shrink:0}
.tip.good{border-color:rgba(25,158,112,.3)}
.tip.warn{border-color:rgba(201,133,0,.35)}

/* data table */
table.data{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:14px}
table.data th{
  text-align:left;color:var(--ink-3);font-weight:600;font-size:11px;letter-spacing:.05em;
  padding:9px 10px;border-bottom:1px solid var(--hairline-2);text-transform:uppercase;
}
table.data td{padding:10px;border-bottom:1px solid var(--hairline);color:var(--ink-2);
  font-variant-numeric:tabular-nums;vertical-align:top}
table.data td.t-text{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
table.data tr:hover td{background:rgba(255,255,255,.02)}
.del-x{cursor:pointer;color:var(--ink-3);border:none;background:none;font-size:14px;padding:2px 6px}
.del-x:hover{color:var(--s-red)}

.hint{font-size:12px;color:var(--ink-3);line-height:1.7;margin-top:10px}
.hint code{background:var(--surface-3);padding:1px 6px;border-radius:5px;font-size:11px;color:var(--gold-2)}
.empty{
  text-align:center;padding:52px 20px;color:var(--ink-3);font-size:13.5px;line-height:1.8;
}
.empty .big{font-size:34px;margin-bottom:10px}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}

/* benchmark structure */
.bm-part{border-left:2px solid var(--s-blue);padding:10px 14px;margin-top:12px;background:var(--surface-2);border-radius:0 10px 10px 0}
.bm-part .bp-tag{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--s-blue);font-weight:700}
.bm-part.hook{border-color:var(--gold)}.bm-part.hook .bp-tag{color:var(--gold-2)}
.bm-part.cta{border-color:var(--s-aqua)}.bm-part.cta .bp-tag{color:#3fc496}
.bm-part p{font-size:13px;color:var(--ink-2);margin-top:6px;line-height:1.65;white-space:pre-wrap}

@media (max-width:1000px){
  .app{flex-direction:column}
  .sidebar{width:100%;height:auto;position:static;flex-direction:column;padding:18px 16px 10px}
  .nav{flex-direction:row;flex-wrap:wrap;gap:6px}
  .nav .sep,.side-foot{display:none}
  .nav a{border-left:none;border-bottom:2px solid transparent;border-radius:8px;padding:8px 11px}
  .nav a.active{border-bottom-color:var(--gold)}
  .main{padding:22px 18px 60px}
  .g4,.g3{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .g2.kpi{grid-template-columns:repeat(2,1fr)}
  .podium{grid-template-columns:1fr}
  .hero-num{font-size:40px}
}
@media (max-width:560px){.g4,.g3,.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>THREADLENS</h1>
      <p>Traffic Essence</p>
    </div>
    <nav class="nav" id="nav">
      <a href="#dashboard" data-v="dashboard"><span class="ico">◈</span>우상향 리포트</a>
      <div class="sep">Traffic</div>
      <a href="#tracking" data-v="tracking"><span class="ico">📈</span>결과값 추적</a>
      <a href="#predict" data-v="predict"><span class="ico">🧭</span>발행 전 로직 점검</a>
      <a href="#timing" data-v="timing"><span class="ico">⏱</span>트래픽 골든타임</a>
      <a href="#persona" data-v="persona"><span class="ico">👥</span>반응층 분석</a>
      <div class="sep">Weapon</div>
      <a href="#benchmark" data-v="benchmark"><span class="ico">🔍</span>하이트래픽 벤치마킹</a>
      <a href="#data" data-v="data"><span class="ico">🗂</span>결과값 수집·관리</a>
    </nav>
    <div class="side-foot">
      모든 데이터는 이 브라우저에만<br>저장됩니다 (localStorage)
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="acct">
        <div class="avatar" id="acctAvatar">T</div>
        <div class="who">
          <div class="name" id="acctName">—</div>
          <div class="meta" id="acctMeta">—</div>
        </div>
      </div>
      <div class="top-actions">
        <span class="badge-demo" id="demoBadge" style="display:none">데모 데이터</span>
        <select class="profile-sel" id="profileSel"></select>
      </div>
    </div>

    <section class="view" id="v-dashboard"></section>
    <section class="view" id="v-tracking"></section>
    <section class="view" id="v-predict"></section>
    <section class="view" id="v-timing"></section>
    <section class="view" id="v-persona"></section>
    <section class="view" id="v-benchmark"></section>
    <section class="view" id="v-data"></section>
  </main>
</div>
<div class="tooltip" id="tooltip"></div>
<script src="app.js"></script>
</body>
</html>
