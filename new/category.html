<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업종별 글 구조 — 스레드렌즈</title>
<meta name="description" content="카페, 식당, 미용실, 학원 등 18개 업종별로 스레드 글 구조 72가지와 복사해서 쓰는 프롬프트를 모았습니다.">
<meta name="theme-color" content="#11141c">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="스레드렌즈 · MOLE COMPANY">
<meta property="og:title" content="스레드렌즈 — 업종별 스레드 글 구조 72개">
<meta property="og:description" content="카페, 식당, 미용실, 학원 등 18개 업종별로 스레드 글 구조 72가지와 복사해서 쓰는 프롬프트를 모았습니다.">
<meta property="og:url" content="https://molezzang.github.io/threadlens/new/category.html">
<meta property="og:image" content="https://molezzang.github.io/threadlens/new/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="모울컴퍼니 로고와 스레드렌즈">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://molezzang.github.io/threadlens/new/assets/og.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="wrap" id="main"></main>

<script src="assets/config.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  var T = TL, $ = T.$, esc = T.esc;
  T.chrome('cat');
  var c = T.cat(T.param('c')), main = $('#main');

  /* 업종을 안 골랐으면 업종 목록 */
  if (!c) {
    main.innerHTML = '<div class="page-h"><h1>업종별 글 구조</h1><p>내 가게와 비슷한 업종을 고르세요. 업종마다 구조 ' + STRUCTS.length + '개가 들어 있습니다.</p></div>' +
      '<div class="cats" style="margin-top:18px">' + CATS.map(function (x) {
        return '<a class="cat" href="category.html?c=' + x.id + '"><span class="ic" aria-hidden="true">' + x.icon + '</span>' + esc(x.name) + '</a>';
      }).join('') + '</div>';
    return;
  }
  document.title = c.name + ' 글 구조 ' + STRUCTS.length + '개 — 스레드렌즈';
  T.store.set('cat', c.id);

  main.innerHTML =
    '<div class="page-h"><a class="linkbtn" href="category.html" style="padding-left:0">‹ 다른 업종</a>' +
    '<h1>' + c.icon + ' ' + esc(c.name) + '</h1><p>글 구조 ' + STRUCTS.length + '개와 잘하는 계정 찾기.</p></div>' +

    '<section class="sec"><h2>잘하는 계정 찾기</h2><p>아래 낱말을 누르면 스레드 검색이 열립니다. 반응 좋은 계정을 찾으면 여기에 찜해 두세요.</p>' +
      '<div class="chips">' + c.kw.map(function (k) {
        return '<a class="chip" target="_blank" rel="noopener" href="' + esc(T.threadsSearch(k)) + '">🔍 ' + esc(k) + '</a>';
      }).join('') + '</div>' +
      '<div class="addrow"><input type="text" id="acctIn" placeholder="찜할 계정 아이디 (예: @abc)" aria-label="찜할 계정 아이디"><button type="button" class="btn" id="acctAdd">찜</button></div>' +
      '<div class="acct" id="accts"></div></section>' +

    '<section class="sec"><h2>글 구조 ' + STRUCTS.length + '개</h2><p>마음에 드는 구조를 골라 바로 글을 만들거나, 프롬프트만 복사해 가세요.</p>' +
      '<div class="filters" id="filters"></div><p class="count" id="count"></p><div class="cards" id="cards"></div></section>';

  /* 찜한 계정 */
  function accts() { return T.store.get('accts_' + c.id, []); }
  function drawAccts() {
    var list = accts();
    $('#accts').innerHTML = list.map(function (a, i) {
      return '<div class="acct-row"><a target="_blank" rel="noopener" href="https://www.threads.com/@' + encodeURIComponent(a) + '">@' + esc(a) + '</a>' +
        '<button type="button" class="linkbtn" data-i="' + i + '">지우기</button></div>';
    }).join('');
    T.$all('#accts .linkbtn').forEach(function (b) {
      b.onclick = function () { var l = accts(); l.splice(+b.dataset.i, 1); T.store.set('accts_' + c.id, l); drawAccts(); };
    });
  }
  function addAcct() {
    var v = $('#acctIn').value.trim().replace(/^.*threads\.(com|net)\/@?/, '').replace(/^@/, '').replace(/[/?].*$/, '');
    if (!/^[A-Za-z0-9._]{1,30}$/.test(v)) { T.toast('계정 아이디를 영어로 적어 주세요 (예: @abc)'); return; }
    var l = accts(); if (l.indexOf(v) < 0) l.unshift(v);
    T.store.set('accts_' + c.id, l); $('#acctIn').value = ''; drawAccts(); T.toast('찜했어요');
  }
  $('#acctAdd').onclick = addAcct;
  $('#acctIn').onkeydown = function (e) { if (e.key === 'Enter') addAcct(); };
  drawAccts();

  /* 구조 목록 */
  var filter = 'all';
  var F = [['all', '전체']].concat(Object.keys(GROUPS).map(function (k) { return [k, GROUPS[k]]; }));
  function drawFilters() {
    $('#filters').innerHTML = F.map(function (f) {
      return '<button type="button" class="chip' + (f[0] === filter ? ' on' : '') + '" data-f="' + f[0] + '">' + f[1] + '</button>';
    }).join('');
    T.$all('#filters .chip').forEach(function (b) { b.onclick = function () { filter = b.dataset.f; drawFilters(); drawCards(); }; });
  }
  function drawCards() {
    var list = STRUCTS.filter(function (s) { return filter === 'all' || s.g === filter; });
    $('#count').textContent = (filter === 'all' ? '전체' : GROUPS[filter]) + ' ' + list.length + '개';
    $('#cards').innerHTML = list.map(function (s) {
      return '<article class="card"><div class="card-top"><span class="no">' + s.id + '</span><span>' + GROUPS[s.g] + '</span><span>·</span><span>' +
        s.goals.map(function (g) { return GOALS[g]; }).join(', ') + '에 좋음</span></div>' +
        '<h3>' + esc(s.n) + '</h3><p class="why">' + esc(s.why) + '</p>' +
        '<p class="hook"><span>첫 문장 예시</span>' + esc(T.fill(s.hook, c)) + '</p>' +
        '<details><summary>글 흐름 보기</summary><ol class="flow" style="margin:0;padding:0 16px 16px">' +
          s.flow.map(function (f) { return '<li>' + esc(T.fill(f, c)) + '</li>'; }).join('') + '</ol></details>' +
        '<div class="row2"><a class="btn sm primary" href="index.html?c=' + c.id + '&s=' + s.id + '">이 구조로 쓰기</a>' +
        '<button type="button" class="btn sm" data-cp="' + s.id + '">프롬프트 복사</button></div></article>';
    }).join('');
    T.$all('[data-cp]').forEach(function (b) {
      b.onclick = function () {
        var s = T.struct(b.dataset.cp);
        T.copy(T.buildPrompt(c, s, '', s.goals[0]), '복사했어요. 소재만 채워서 쓰세요');
      };
    });
  }
  drawFilters(); drawCards();
})();
</script>
</body>
</html>
